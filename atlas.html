<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>#atlas{width:100%;height:68vh;min-height:360px;border-radius:12px;overflow:hidden}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bar select{background:var(--card);color:var(--tx);border:1px solid var(--mu);border-radius:8px;padding:4px 8px}
.bar button{background:var(--card);color:var(--tx);border:1px solid var(--mu);border-radius:8px;padding:4px 10px;cursor:pointer}
.bar button.on{background:var(--ac);color:#000;border-color:var(--ac)}#ex h2{margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{background:var(--card);color:var(--tx);border:1px solid var(--mu);border-radius:20px;padding:4px 12px;cursor:pointer}
.chips button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px;perspective:900px}
.k3{background:var(--bg);border-radius:14px;padding:10px;box-shadow:0 12px 28px #0006;transition:transform .15s;transform-style:preserve-3d}
.k3 img{width:100%;height:170px;object-fit:cover;border-radius:10px;transform:translateZ(30px);box-shadow:0 10px 20px #0007}
.k3 h3{margin:10px 0 4px;transform:translateZ(18px)}.k3 p{font-size:.9rem;margin:0 0 6px}.k3 a{color:var(--ac)}
</style>
</head><body><main>
<div id="langs"><button data-l="0">සිංහල</button><button data-l="1">தமிழ்</button><button data-l="2">English</button></div>
<h1 id="ttl"></h1><p class="sub" id="sub"></p>
<div id="atlas"></div>
<div class="bar"><button id="bsat" class="on"></button><button id="b3d" class="on"></button><button id="bfly"></button><button id="bhome">🏠 Sri Lanka</button><select id="tour"><option value="">📍</option><option value="1"></option><option value="2"></option><option value="3"></option><option value="4"></option><option value="5"></option><option value="6"></option><option value="7"></option><option value="8"></option><option value="9"></option></select></div>
<p class="note" id="note"></p>
<div class="card" id="p"></div>
<section class="card" id="ex"></section>
</main>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="atlas.js"></script>
</body></html>
