<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ලෝක ඉතිහාස සිතියම</title>
<link rel="stylesheet" href="style.css"></head><body><main>
<h1>🌍 ලෝක ඉතිහාස සිතියම</h1>
<p class="sub">Slider එක ඇදලා කාලය ආපස්සට යන්න. අද ලෝක සිතියමේ තියෙන තැනි ලකුණු (🟠) ඔබලා රටවල ඉතිහාසය බලන්න.</p>
<svg id="m" viewBox="0 0 360 180" role="img" aria-label="ලෝක සිතියම"></svg>
<div class="card">
<div id="era"></div><div id="desc"></div>
<input id="s" type="range" min="0" max="4" step="1" value="4" aria-label="කාලය">
<div class="ticks"><span>මිලියන 250</span><span>මිලියන 100</span><span>මිලියන 50</span><span>ක්‍රි.පූ. 20,000</span><span>අද</span></div>
<p class="note">සටහන: සිතියම සරල කළ ආසන්න ආකෘතියකි (ඉගැන්වීම සඳහා).</p>
</div>
<div class="card" id="p"><b>රටක් තෝරන්න</b><br><span class="note">සිතියමේ තැඹිලි ලකුණක් ඔබන්න.</span></div>
</main>
<script src="script.js"></script></body></html>
